# Display layout, applied by bin/x11-monitor via xrandr.
#
# NOT i3 syntax, and deliberately outside conf.d/ so `include conf.d/*.conf`
# cannot pick it up. conf.d/05-monitors.conf runs the script that reads it.
#
#   <output>,<resolution>,<rate>,<position>,<flag>
#
# output      as named by `xrandr --query` (DP-1, HDMI-1, eDP-1 …), or `*`
#             for every output without a line of its own
# resolution  `preferred` (the mode xrandr marks `+` — the panel's native
#             one) or an explicit `2560x1440`, or `off` to disable the output
# rate        `highest` (fastest mode the resolution offers) or a figure in
#             Hz. `144` matches xrandr's 143.91 — anything within 1 Hz counts,
#             so you needn't copy the decimals out of `xrandr --query`
# position    `auto` (first output at 0x0, each next one to its right),
#             `<x>x<y>`, or `right-of <output>` / `left-of` / `above` /
#             `below` / `same-as`
# flag        `primary` to make this the primary output; otherwise the first
#             enabled output is
#
# Trailing fields may be omitted; they default to preferred,highest,auto.
# Re-apply after editing with `i3-msg reload`, or `x11-monitor -f` directly.

# Every connected output at its native resolution and fastest refresh rate.
# This is hyprland's `monitor=,preferred,highrr,auto` — 144 Hz panels come up
# at 144 Hz without being named here.
*,preferred,highest,auto

# Examples — uncomment and adapt.
#
# Pin one panel to 144 Hz and make it primary, with a second to its left:
# DP-1,2560x1440,144,0x0,primary
# HDMI-1,1920x1080,60,left-of DP-1
#
# Laptop panel off while docked:
# eDP-1,off
#
# Mirror an external onto the laptop panel:
# HDMI-1,preferred,highest,same-as eDP-1
