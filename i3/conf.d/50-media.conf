# Media & hardware keys: volume, brightness, playback, capture, nightlight.
# OSD is handled with dunst progress notifications inside the helper scripts.

# ── volume ────────────────────────────────────────────────────────────────

bindsym XF86AudioRaiseVolume exec --no-startup-id $bin/x11-volume up
bindsym XF86AudioLowerVolume exec --no-startup-id $bin/x11-volume down
bindsym Mod1+XF86AudioRaiseVolume exec --no-startup-id $bin/x11-volume up-fine
bindsym Mod1+XF86AudioLowerVolume exec --no-startup-id $bin/x11-volume down-fine
bindsym XF86AudioMute exec --no-startup-id $bin/x11-volume mute
bindsym XF86AudioMicMute exec --no-startup-id $bin/x11-volume mic-mute

# ── brightness ────────────────────────────────────────────────────────────

bindsym XF86MonBrightnessUp exec --no-startup-id $bin/x11-brightness up
bindsym XF86MonBrightnessDown exec --no-startup-id $bin/x11-brightness down
bindsym Mod1+XF86MonBrightnessUp exec --no-startup-id $bin/x11-brightness up-fine
bindsym Mod1+XF86MonBrightnessDown exec --no-startup-id $bin/x11-brightness down-fine
bindsym Shift+XF86MonBrightnessUp exec --no-startup-id $bin/x11-brightness max
bindsym Shift+XF86MonBrightnessDown exec --no-startup-id $bin/x11-brightness min

# ── playback ──────────────────────────────────────────────────────────────

bindsym XF86AudioPlay exec --no-startup-id playerctl play-pause
bindsym XF86AudioPause exec --no-startup-id playerctl play-pause
bindsym XF86AudioNext exec --no-startup-id playerctl next
bindsym XF86AudioPrev exec --no-startup-id playerctl previous

# ── nightlight ────────────────────────────────────────────────────────────

bindsym $mod+Ctrl+n exec --no-startup-id $bin/x11-nightlight

# ── screenshots ───────────────────────────────────────────────────────────

bindsym $mod+semicolon exec --no-startup-id $bin/x11-screenshot region
bindsym Print exec --no-startup-id $bin/x11-screenshot full

# ── screen recording ──────────────────────────────────────────────────────

bindsym $mod+r exec --no-startup-id $bin/x11-screenrecord
bindsym $mod+Shift+r exec --no-startup-id $bin/x11-screenrecord --stop
bindsym $mod+Ctrl+r exec --no-startup-id $bin/x11-screenrecord --gif
