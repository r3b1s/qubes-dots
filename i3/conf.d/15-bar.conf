# The i3bar. Lifted verbatim out of 00-qubes-base.conf — see that file's
# header — with `position top` as our only change.
#
# It has to live in our layer rather than the vendored copy because i3 gives
# no way to override a `bar` block from a later file: it keeps the first one
# declared, and a second block spawns a second bar even when both name the
# same `id`. So there is exactly one `bar` block in this config, and this is
# it. Nothing else in conf.d/ may declare another.
#
# `status_command` is qubes-i3status, not plain i3status: it appends the
# domain-aware fields (qube count, disk usage per pool) to the i3status line.

bar {
        position top

        status_command qubes-i3status
        colors {
            background #d2d2d2
            statusline #333333

            #class               #border #backgr #text
            focused_workspace    #3874d8 #63a0ff #333333
            active_workspace     #333333 #888888 #f5f5f5
            inactive_workspace   #888888 #333333 #888888
            urgent_workspace     #bd2727 #e79e27 #333333
        }

}
