# Workspaces: numbered, named "scratchpad" workspaces, and window routing.

# ── numbered workspaces ───────────────────────────────────────────────────

bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

# Move window and follow it (hyprland's default move behavior).
bindsym $mod+Shift+1 move container to workspace number 1; workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2; workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3; workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4; workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5; workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6; workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7; workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8; workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9; workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10; workspace number 10

# Move window silently (stay on the current workspace).
bindsym $mod+Shift+Mod1+1 move container to workspace number 1
bindsym $mod+Shift+Mod1+2 move container to workspace number 2
bindsym $mod+Shift+Mod1+3 move container to workspace number 3
bindsym $mod+Shift+Mod1+4 move container to workspace number 4
bindsym $mod+Shift+Mod1+5 move container to workspace number 5
bindsym $mod+Shift+Mod1+6 move container to workspace number 6
bindsym $mod+Shift+Mod1+7 move container to workspace number 7
bindsym $mod+Shift+Mod1+8 move container to workspace number 8
bindsym $mod+Shift+Mod1+9 move container to workspace number 9
bindsym $mod+Shift+Mod1+0 move container to workspace number 10

# ── workspace navigation ──────────────────────────────────────────────────

bindsym $mod+Tab workspace next
# Shift+Tab emits ISO_Left_Tab on X11, so bind the keycode (Tab = 23).
bindcode $mod+Shift+23 workspace prev
bindsym $mod+Ctrl+Tab workspace back_and_forth

# ── monitors ──────────────────────────────────────────────────────────────

bindsym Ctrl+Mod1+Tab focus output next

bindsym $mod+Shift+Mod1+Left move workspace to output left
bindsym $mod+Shift+Mod1+Right move workspace to output right
bindsym $mod+Shift+Mod1+Up move workspace to output up
bindsym $mod+Shift+Mod1+Down move workspace to output down

# ── named workspaces (hyprland special workspaces) ────────────────────────
# x11-ws-app toggles the workspace and launches the command when it's empty,
# mimicking hyprland's on_created_empty special workspaces.

# terminals
bindsym $mod+t exec --no-startup-id $bin/x11-ws-app term1 $term
bindsym $mod+Shift+Ctrl+t move container to workspace term1
bindsym $mod+g exec --no-startup-id $bin/x11-ws-app term2 $term
bindsym $mod+Shift+Ctrl+g move container to workspace term2

# system tools
bindsym $mod+p exec --no-startup-id $bin/x11-ws-app btop $term -e btop
bindsym $mod+Shift+d exec --no-startup-id $bin/x11-ws-app lazydocker $term -e lazydocker
bindsym $mod+Shift+w exec --no-startup-id "$bin/x11-ws-app easyeffects sh -c 'easyeffects & exec i3-sensible-terminal -e wiremix'"
bindsym $mod+Ctrl+w exec --no-startup-id $bin/x11-ws-app wifi $term -e nmtui
bindsym $mod+Mod1+w exec --no-startup-id $bin/x11-ws-app bluetooth $term -e bluetui

# browsers
bindsym $mod+u exec --no-startup-id $bin/x11-ws-app browser1 $browser
bindsym $mod+Shift+Ctrl+u move container to workspace browser1
bindsym $mod+Mod1+b exec --no-startup-id $bin/x11-ws-app browser2 $browser

# chat
bindsym $mod+comma exec --no-startup-id $bin/x11-ws-app signal signal-desktop
bindsym $mod+Shift+Ctrl+comma move container to workspace signal
bindsym $mod+slash exec --no-startup-id $bin/x11-ws-app discord flatpak run dev.vencord.Vesktop
bindsym $mod+Shift+Ctrl+slash move container to workspace discord

# apps
bindsym $mod+o exec --no-startup-id $bin/x11-ws-app obsidian obsidian
bindsym $mod+Shift+Ctrl+o move container to workspace obsidian
bindsym $mod+m exec --no-startup-id $bin/x11-ws-app grayjay flatpak run app.grayjay.Grayjay
bindsym $mod+Ctrl+m exec --no-startup-id $bin/x11-ws-app moonlight gtk-launch com.moonlight_stream.Moonlight

# password managers
bindsym $mod+Shift+p exec --no-startup-id $bin/x11-ws-app bitwarden bitwarden-desktop
bindsym $mod+Ctrl+p exec --no-startup-id $bin/x11-ws-app keepassxc keepassxc
bindsym $mod+Shift+Ctrl+p exec --no-startup-id $bin/x11-ws-app cryptomator gtk-launch org.cryptomator.Cryptomator

# webapp workspaces
bindsym $mod+a exec --no-startup-id "$bin/x11-ws-app llm sh -c '$bin/x11-webapp https://chatgpt.com & $bin/x11-webapp https://claude.ai & $bin/x11-webapp https://google.com'"
bindsym $mod+Shift+Ctrl+a move container to workspace llm
bindsym $mod+i exec --no-startup-id $bin/x11-ws-app dictionary $bin/x11-webapp "https://www.onelook.com/thesaurus"
bindsym $mod+Mod1+g exec --no-startup-id $bin/x11-ws-app gitlab $bin/x11-webapp "https://gitlab.com"
bindsym $mod+equal exec --no-startup-id $bin/x11-ws-app calendar $bin/x11-webapp "https://calendar.proton.me"
bindsym $mod+Mod1+equal exec --no-startup-id $bin/x11-ws-app email $bin/x11-webapp "https://mail.proton.me"

# empty utility workspaces
bindsym $mod+period exec --no-startup-id $bin/x11-ws-app util1
bindsym $mod+Shift+Ctrl+period move container to workspace util1
bindsym $mod+minus exec --no-startup-id $bin/x11-ws-app util2
bindsym $mod+Shift+Ctrl+minus move container to workspace util2
bindsym $mod+y exec --no-startup-id $bin/x11-ws-app util3
bindsym $mod+Shift+Ctrl+y move container to workspace util3

# ── window routing ────────────────────────────────────────────────────────
# Route app windows to their workspace regardless of how they were started.
# X11 classes vary per app/packaging — verify with `xprop WM_CLASS`.

assign [class="(?i)vesktop"] discord
assign [class="(?i)signal"] signal
assign [class="(?i)obsidian"] obsidian
assign [class="(?i)bitwarden"] bitwarden
assign [class="(?i)keepassxc"] keepassxc
assign [class="(?i)cryptomator"] cryptomator
assign [class="(?i)moonlight"] moonlight
assign [class="(?i)grayjay"] grayjay
assign [class="(?i)easyeffects"] easyeffects

# floating dialogs
for_window [window_role="pop-up"] floating enable
for_window [class="(?i)gnome-calculator"] floating enable
