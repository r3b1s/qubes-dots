# Modes (hyprland submaps → i3 modes). The active mode shows in i3bar,
# which replaces the notify-send banners the hyprland submaps used.

# ── gaps resize ───────────────────────────────────────────────────────────
# h/l: outer horizontal | j/k: outer vertical | arrows: inner (uniform)

mode "gaps" {
    bindsym l gaps horizontal current plus 20
    bindsym h gaps horizontal current minus 20
    bindsym k gaps vertical current plus 20
    bindsym j gaps vertical current minus 20

    bindsym Right gaps inner current plus 2
    bindsym Up gaps inner current plus 2
    bindsym Left gaps inner current minus 2
    bindsym Down gaps inner current minus 2

    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+Ctrl+g mode "gaps"

# ── browser profiles ──────────────────────────────────────────────────────
# 0-9/d: launch profile | Shift+…: incognito | p: throwaway incognito
# n: profile picker GUI | Esc: exit

mode "browser-profiles" {
    bindsym 0 exec $browser --profile-directory='Profile 0'; mode "default"
    bindsym 1 exec $browser --profile-directory='Profile 1'; mode "default"
    bindsym 2 exec $browser --profile-directory='Profile 2'; mode "default"
    bindsym 3 exec $browser --profile-directory='Profile 3'; mode "default"
    bindsym 4 exec $browser --profile-directory='Profile 4'; mode "default"
    bindsym 5 exec $browser --profile-directory='Profile 5'; mode "default"
    bindsym 6 exec $browser --profile-directory='Profile 6'; mode "default"
    bindsym 7 exec $browser --profile-directory='Profile 7'; mode "default"
    bindsym 8 exec $browser --profile-directory='Profile 8'; mode "default"
    bindsym 9 exec $browser --profile-directory='Profile 9'; mode "default"
    bindsym d exec $browser --profile-directory='Default'; mode "default"

    bindsym Shift+0 exec $browser --profile-directory='Profile 0' --incognito; mode "default"
    bindsym Shift+1 exec $browser --profile-directory='Profile 1' --incognito; mode "default"
    bindsym Shift+2 exec $browser --profile-directory='Profile 2' --incognito; mode "default"
    bindsym Shift+3 exec $browser --profile-directory='Profile 3' --incognito; mode "default"
    bindsym Shift+4 exec $browser --profile-directory='Profile 4' --incognito; mode "default"
    bindsym Shift+5 exec $browser --profile-directory='Profile 5' --incognito; mode "default"
    bindsym Shift+6 exec $browser --profile-directory='Profile 6' --incognito; mode "default"
    bindsym Shift+7 exec $browser --profile-directory='Profile 7' --incognito; mode "default"
    bindsym Shift+8 exec $browser --profile-directory='Profile 8' --incognito; mode "default"
    bindsym Shift+9 exec $browser --profile-directory='Profile 9' --incognito; mode "default"
    bindsym Shift+d exec $browser --profile-directory='Default' --incognito; mode "default"

    bindsym p exec $browser --profile-directory="/run/user/$(id -u)/$browser/private-tmp" --incognito; mode "default"
    bindsym n exec $browser --profile-directory='System Profile'; mode "default"

    bindsym Escape mode "default"
}
bindsym $mod+Shift+Ctrl+Mod1+b mode "browser-profiles"

# ── VM passthrough ────────────────────────────────────────────────────────
# While active, i3 grabs nothing except Delete (exit), so every $mod chord
# reaches the VM / remote-desktop client.

mode "passthru" {
    bindsym Delete mode "default"
}
bindsym $mod+Delete mode "passthru"
