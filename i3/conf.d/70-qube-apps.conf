# Qube app launching: every user-facing application runs inside a named
# AppVM via qvm-run, never as a local dom0 process.
#
# EDIT THE VARIABLES BELOW before using this config. The names shipped here
# are placeholders — until they match real AppVMs on this machine, every
# bind in this file will fail with a qvm-run error.

# ── AppVM targets ─────────────────────────────────────────────────────────

set $vm_default personal0

set $vm_browser $vm_default
set $vm_chat $vm_default
set $vm_vault $vm_default
set $vm_notes $vm_default
set $vm_media $vm_default

# Separate AppVM for anonymous browsing (Whonix-Workstation template).
set $vm_anon anon-whonix

# Browser binaries as named inside the AppVM.  $browser_bin_firefox is the
# default; $browser_bin_brave is defined but unused by default — wire it in
# when you want a Chromium-based browser in any bind below.
set $browser_bin_firefox firefox
set $browser_bin_brave  brave-origin

# ── named workspaces ──────────────────────────────────────────────────────
# x11-ws-app toggles the workspace and, when it's empty, runs the command —
# here that command is a qvm-run into the target AppVM.

# browsers
bindsym $mod+u exec --no-startup-id $bin/x11-ws-app browser1 qvm-run -a "$vm_browser" -- $browser_bin_firefox
bindsym $mod+Shift+Ctrl+u move container to workspace browser1

# chat
bindsym $mod+comma exec --no-startup-id $bin/x11-ws-app signal qvm-run -a "$vm_chat" -- signal-desktop
bindsym $mod+Shift+Ctrl+comma move container to workspace signal
bindsym $mod+slash exec --no-startup-id $bin/x11-ws-app discord qvm-run -a "$vm_chat" -- vesktop
bindsym $mod+Shift+Ctrl+slash move container to workspace discord

# apps
bindsym $mod+o exec --no-startup-id $bin/x11-ws-app obsidian qvm-run -a "$vm_notes" -- obsidian
bindsym $mod+Shift+Ctrl+o move container to workspace obsidian
bindsym $mod+m exec --no-startup-id $bin/x11-ws-app grayjay qvm-run -a "$vm_media" -- flatpak run app.grayjay.Grayjay
bindsym $mod+Ctrl+m exec --no-startup-id $bin/x11-ws-app moonlight qvm-run -a "$vm_media" -- gtk-launch com.moonlight_stream.Moonlight

# password managers
bindsym $mod+Shift+p exec --no-startup-id $bin/x11-ws-app bitwarden qvm-run -a "$vm_vault" -- bitwarden-desktop
bindsym $mod+Ctrl+p exec --no-startup-id $bin/x11-ws-app keepassxc qvm-run -a "$vm_vault" -- keepassxc
bindsym $mod+Shift+Ctrl+p exec --no-startup-id $bin/x11-ws-app cryptomator qvm-run -a "$vm_vault" -- gtk-launch org.cryptomator.Cryptomator

# anonymous browsing (separate AppVM via Whonix)
bindsym $mod+Mod1+b exec --no-startup-id $bin/x11-ws-app tor qvm-run -a "$vm_anon" -- torbrowser

# webapp workspaces
# The VM's own xdg-open picks its default browser.
bindsym $mod+a exec --no-startup-id "$bin/x11-ws-app llm sh -c 'qvm-run -a $vm_browser -- xdg-open https://chatgpt.com & qvm-run -a $vm_browser -- xdg-open https://claude.ai & qvm-run -a $vm_browser -- xdg-open https://google.com'"
bindsym $mod+Shift+Ctrl+a move container to workspace llm
bindsym $mod+i exec --no-startup-id $bin/x11-ws-app dictionary qvm-run -a "$vm_browser" -- xdg-open "https://www.onelook.com/thesaurus"
bindsym $mod+Mod1+g exec --no-startup-id $bin/x11-ws-app gitlab qvm-run -a "$vm_browser" -- xdg-open "https://gitlab.com"
bindsym $mod+equal exec --no-startup-id $bin/x11-ws-app calendar qvm-run -a "$vm_browser" -- xdg-open "https://calendar.proton.me"
bindsym $mod+Mod1+equal exec --no-startup-id $bin/x11-ws-app email qvm-run -a "$vm_browser" -- xdg-open "https://mail.proton.me"

# ── direct launches (non-workspace variants) ──────────────────────────────

bindsym $mod+b exec qvm-run -a "$vm_browser" -- $browser_bin_firefox
bindsym $mod+Shift+b exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P Personal
bindsym $mod+Ctrl+b exec qvm-run -a "$vm_browser" -- qutebrowser --target window

bindsym $mod+Shift+o exec qvm-run -a "$vm_notes" -- obsidian
bindsym $mod+Shift+m exec qvm-run -a "$vm_media" -- flatpak run app.grayjay.Grayjay

# ── webapps ───────────────────────────────────────────────────────────────

bindsym $mod+Shift+a exec --no-startup-id qvm-run -a "$vm_browser" -- xdg-open "https://www.perplexity.ai/"
bindsym $mod+Ctrl+a exec --no-startup-id qvm-run -a "$vm_browser" -- xdg-open "https://claude.ai"
bindsym $mod+Mod1+a exec --no-startup-id qvm-run -a "$vm_browser" -- xdg-open "https://chatgpt.com"
bindsym $mod+Ctrl+equal exec --no-startup-id qvm-run -a "$vm_browser" -- xdg-open "https://calendar.proton.me"
bindsym $mod+Ctrl+Mod1+equal exec --no-startup-id qvm-run -a "$vm_browser" -- xdg-open "https://mail.proton.me"

# ── browser profiles ──────────────────────────────────────────────────────
# 0-9/d: launch profile (by name, create matching Firefox profiles first)
# Shift+…: private window with that profile | p: throwaway private window
# n: profile picker GUI | Esc: exit
# Every variant runs inside $vm_browser.

mode "browser-profiles" {
    bindsym 0 exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P "Profile 0"; mode "default"
    bindsym 1 exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P "Profile 1"; mode "default"
    bindsym 2 exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P "Profile 2"; mode "default"
    bindsym 3 exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P "Profile 3"; mode "default"
    bindsym 4 exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P "Profile 4"; mode "default"
    bindsym 5 exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P "Profile 5"; mode "default"
    bindsym 6 exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P "Profile 6"; mode "default"
    bindsym 7 exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P "Profile 7"; mode "default"
    bindsym 8 exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P "Profile 8"; mode "default"
    bindsym 9 exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P "Profile 9"; mode "default"
    bindsym d exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P default; mode "default"

    bindsym Shift+0 exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P "Profile 0" --private-window; mode "default"
    bindsym Shift+1 exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P "Profile 1" --private-window; mode "default"
    bindsym Shift+2 exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P "Profile 2" --private-window; mode "default"
    bindsym Shift+3 exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P "Profile 3" --private-window; mode "default"
    bindsym Shift+4 exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P "Profile 4" --private-window; mode "default"
    bindsym Shift+5 exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P "Profile 5" --private-window; mode "default"
    bindsym Shift+6 exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P "Profile 6" --private-window; mode "default"
    bindsym Shift+7 exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P "Profile 7" --private-window; mode "default"
    bindsym Shift+8 exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P "Profile 8" --private-window; mode "default"
    bindsym Shift+9 exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P "Profile 9" --private-window; mode "default"
    bindsym Shift+d exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P default --private-window; mode "default"

    # Throwaway private session — no profile needed.
    bindsym p exec qvm-run -a "$vm_browser" -- $browser_bin_firefox --private-window; mode "default"
    # Profile picker GUI.
    bindsym n exec qvm-run -a "$vm_browser" -- $browser_bin_firefox -P; mode "default"

    bindsym Escape mode "default"
}
bindsym $mod+Shift+Ctrl+Mod1+b mode "browser-profiles"

# ── window routing ────────────────────────────────────────────────────────
# Qubes' GUI virtualization surfaces a VM-run application's window with that
# application's own WM_CLASS, so class-keyed assign rules work unchanged.

assign [class="(?i)vesktop"] discord
assign [class="(?i)signal"] signal
assign [class="(?i)obsidian"] obsidian
assign [class="(?i)bitwarden"] bitwarden
assign [class="(?i)keepassxc"] keepassxc
assign [class="(?i)cryptomator"] cryptomator
assign [class="(?i)moonlight"] moonlight
assign [class="(?i)grayjay"] grayjay
