# Display layout. i3 has no mode-setting of its own, so refresh rate and
# monitor arrangement are xrandr's job; `../monitor.conf` describes them and
# bin/x11-monitor applies it.
#
# `exec_always` re-runs on every reload and restart, which is how a
# monitor.conf edit takes effect. The script exits without touching xrandr
# when the outputs already match, so reloading does not flash the screen.
#
# Sorts before 10-core.conf so the outputs exist at their final size before
# anything else in the config lays windows out on them.

exec_always --no-startup-id $bin/x11-monitor

# Desktop wallpaper (needs feh — see README required packages).
exec_always --no-startup-id feh --bg-fill ~/.config/wallpapers/moon.jpg
