# Launchers, terminals, notifications, media keys.
# Application launches live in 70-qube-apps.conf (they run inside AppVMs).

# ── launchers ─────────────────────────────────────────────────────────────
# Both launchers are Qubes' own, invoked exactly as upstream invokes them —
# only the chords differ. j4-dmenu-desktop reads the per-VM .desktop entries
# Qubes generates in dom0, and $dmenu_extra_args is what makes a terminal-type
# entry open inside its own qube rather than in a dom0 shell.

bindsym $mod+Return exec --no-startup-id LANG=C $dmenu $dmenu_common_args $dmenu_extra_args
# The official Qubes application menu.
bindsym $mod+Shift+d exec --no-startup-id qubes-app-menu
# Raw dom0 PATH binaries (sits on the old omarchy-menu chord).
bindsym $mod+space exec --no-startup-id $bin/x11-dmenu --run
# System/power menu.
bindsym $mod+Escape exec --no-startup-id $bin/x11-power-menu
bindsym XF86PowerOff exec --no-startup-id $bin/x11-power-menu
# Keybinding cheatsheet.
bindsym $mod+Shift+Ctrl+Mod1+k exec --no-startup-id $bin/x11-keybinds-menu

# ── lock ──────────────────────────────────────────────────────────────────
# $lock comes from 00-qubes-base.conf, which also wires it into xss-lock.

bindsym $mod+Shift+Ctrl+Mod1+l exec --no-startup-id $lock

# ── terminals ─────────────────────────────────────────────────────────────

# Terminal in the domain of the focused window.
bindsym $mod+Shift+t exec $terminal
# Disposable console into the focused window's qube.
bindsym $mod+Shift+Return exec $console
# Terminal opened in this dots repo (resolved through the ~/.config/i3 symlink).
# Explicitly a dom0 terminal, because the repo lives in dom0.
bindsym $mod+Mod1+t exec sh -c 'cd "$(dirname "$(readlink -f ~/.config/i3)")" && exec i3-sensible-terminal'

# ── notifications (dunst) ─────────────────────────────────────────────────

bindsym $mod+x exec --no-startup-id dunstctl close
bindsym $mod+Shift+x exec --no-startup-id dunstctl close-all
bindsym $mod+Ctrl+x exec --no-startup-id dunstctl set-paused toggle
bindsym $mod+Mod1+x exec --no-startup-id dunstctl history-pop

# ── volume ────────────────────────────────────────────────────────────────
# Upstream binds these to pactl directly, so pactl is dom0 baseline and these
# belong in the active config rather than risky-utilities. x11-volume wraps the
# same pactl calls and adds a dunst OSD plus fine-grained steps.

bindsym XF86AudioRaiseVolume exec --no-startup-id $bin/x11-volume up
bindsym XF86AudioLowerVolume exec --no-startup-id $bin/x11-volume down
bindsym Mod1+XF86AudioRaiseVolume exec --no-startup-id $bin/x11-volume up-fine
bindsym Mod1+XF86AudioLowerVolume exec --no-startup-id $bin/x11-volume down-fine
bindsym XF86AudioMute exec --no-startup-id $bin/x11-volume mute
bindsym XF86AudioMicMute exec --no-startup-id $bin/x11-volume mic-mute
