# Launchers (dmenu), terminals, browsers, direct app launches, notifications.

# ── dmenu ─────────────────────────────────────────────────────────────────

# App launcher (walker replacement): desktop apps via dmenu.
bindsym $mod+Return exec --no-startup-id i3-dmenu-desktop
# Raw PATH binaries (sits on the old omarchy-menu chord).
bindsym $mod+space exec --no-startup-id dmenu_run
# System/power menu.
bindsym $mod+Escape exec --no-startup-id $bin/x11-power-menu
bindsym XF86PowerOff exec --no-startup-id $bin/x11-power-menu
# Keybinding cheatsheet.
bindsym $mod+Shift+Ctrl+Mod1+k exec --no-startup-id $bin/x11-keybinds-menu

# ── lock ──────────────────────────────────────────────────────────────────

bindsym $mod+Shift+Ctrl+Mod1+l exec --no-startup-id $bin/x11-lock

# ── terminals ─────────────────────────────────────────────────────────────

bindsym $mod+Shift+t exec $term
bindsym $mod+Ctrl+t exec $term -e tmux-sessionizer
# Terminal opened in this dots repo (resolved through the ~/.config/i3 symlink).
bindsym $mod+Mod1+t exec sh -c 'cd "$(dirname "$(readlink -f ~/.config/i3)")" && exec i3-sensible-terminal'

# ── file manager ──────────────────────────────────────────────────────────

bindsym $mod+e exec nautilus --new-window

# ── browsers ──────────────────────────────────────────────────────────────

bindsym $mod+b exec $browser
bindsym $mod+Shift+b exec firefox -p Personal
bindsym $mod+Ctrl+b exec qutebrowser --target window

# ── direct app launches (non-workspace variants) ──────────────────────────

bindsym $mod+Shift+o exec obsidian
bindsym $mod+Mod1+p exec $term -e btop
bindsym $mod+Shift+m exec flatpak run app.grayjay.Grayjay

# ── webapps ───────────────────────────────────────────────────────────────

bindsym $mod+Shift+a exec --no-startup-id $bin/x11-webapp "https://www.perplexity.ai/"
bindsym $mod+Ctrl+a exec --no-startup-id $bin/x11-webapp "https://claude.ai"
bindsym $mod+Mod1+a exec --no-startup-id $bin/x11-webapp "https://chatgpt.com"
bindsym $mod+Ctrl+equal exec --no-startup-id $bin/x11-webapp "https://calendar.proton.me"
bindsym $mod+Ctrl+Mod1+equal exec --no-startup-id $bin/x11-webapp "https://mail.proton.me"

# ── notifications (dunst) ─────────────────────────────────────────────────

bindsym $mod+x exec --no-startup-id dunstctl close
bindsym $mod+Shift+x exec --no-startup-id dunstctl close-all
bindsym $mod+Ctrl+x exec --no-startup-id dunstctl set-paused toggle
bindsym $mod+Mod1+x exec --no-startup-id dunstctl history-pop

# ── misc ──────────────────────────────────────────────────────────────────

bindsym $mod+q exec ~/.cargo/bin/inputbox
bindsym XF86Calculator exec gnome-calculator
# Color picker (hyprpicker replacement).
bindsym $mod+Shift+Ctrl+Mod1+p exec --no-startup-id "xcolor | xclip -selection clipboard && dunstify -a x11-dots 'Color copied to clipboard'"
# Wipe the clipboard.
bindsym $mod+Shift+Ctrl+Mod1+v exec --no-startup-id "printf '' | xclip -selection clipboard && dunstify -a x11-dots 'Clipboard cleared'"
