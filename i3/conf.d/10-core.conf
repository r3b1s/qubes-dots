# Core tiling: focus, move, resize, layouts, fullscreen, floating.

# ── focus ─────────────────────────────────────────────────────────────────

bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right

bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# Container tree navigation (replaces the master-layout roll binds).
bindsym $mod+n focus parent
bindsym $mod+Shift+n focus child

# ── move windows ──────────────────────────────────────────────────────────

# hyprland swap → i3 move (i3's only directional move within a workspace)
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# hyprland "move without swapping" → move to the adjacent output instead
bindsym $mod+Shift+Ctrl+h move container to output left
bindsym $mod+Shift+Ctrl+j move container to output down
bindsym $mod+Shift+Ctrl+k move container to output up
bindsym $mod+Shift+Ctrl+l move container to output right

# Nudge floating windows for manual repositioning.
bindsym $mod+Shift+Mod1+h move left 20 px
bindsym $mod+Shift+Mod1+j move down 20 px
bindsym $mod+Shift+Mod1+k move up 20 px
bindsym $mod+Shift+Mod1+l move right 20 px

# ── resize ────────────────────────────────────────────────────────────────

# delta-resize equivalent: ~5% of the monitor per press, no script needed.
bindsym $mod+Ctrl+h resize grow width 100 px or 6 ppt
bindsym $mod+Ctrl+l resize shrink width 100 px or 6 ppt
bindsym $mod+Ctrl+k resize grow height 100 px or 6 ppt
bindsym $mod+Ctrl+j resize shrink height 100 px or 6 ppt

# ── window state ──────────────────────────────────────────────────────────

bindsym $mod+w kill

# hyprland's 4-way fullscreen matrix collapses to i3's single toggle;
# both old muscle-memory chords land on it.
bindsym $mod+f fullscreen toggle
bindsym $mod+Mod1+f fullscreen toggle

bindsym $mod+Shift+Ctrl+Mod1+f floating toggle

# ── layouts (replaces the hyprland master-layout binds) ───────────────────

bindsym $mod+s layout toggle tabbed split
bindsym $mod+Shift+s layout toggle stacking split
bindsym $mod+Ctrl+s split toggle
bindsym $mod+Mod1+BackSpace layout toggle all

# ── appearance cycles ─────────────────────────────────────────────────────

bindsym $mod+Shift+BackSpace exec --no-startup-id $bin/x11-gaps-cycle
bindsym $mod+Ctrl+BackSpace exec --no-startup-id $bin/x11-borders-cycle

# ── i3 session ────────────────────────────────────────────────────────────

bindsym $mod+Shift+Ctrl+Mod1+c reload
bindsym $mod+Shift+Ctrl+Mod1+w restart
