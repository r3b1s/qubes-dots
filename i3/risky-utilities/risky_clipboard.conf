# REFERENCE ONLY — not loaded by i3.
#
# This file lives outside conf.d/, so `include conf.d/*.conf` never picks it
# up. To use a bind, first install its packages, then either copy it into a
# file under conf.d/ or add an explicit
# `include risky-utilities/risky_clipboard.conf` line to i3/config.
#
# qubes-dots keeps these out of the active config because they need packages
# beyond the dom0 baseline of `i3` + `i3-settings-qubes`:
#
#   color picker     xcolor + xclip
#   clipboard wipe   xclip

# ── color picker (hyprpicker replacement) ─────────────────────────────────

bindsym $mod+Shift+Ctrl+Mod1+p exec --no-startup-id "xcolor | xclip -selection clipboard && dunstify -a x11-dots 'Color copied to clipboard'"

# ── clipboard wipe ────────────────────────────────────────────────────────

bindsym $mod+Shift+Ctrl+Mod1+v exec --no-startup-id "printf '' | xclip -selection clipboard && dunstify -a x11-dots 'Clipboard cleared'"
