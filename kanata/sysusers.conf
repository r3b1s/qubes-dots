# Installed by install-kanata-dom0.sh to /etc/sysusers.d/kanata.conf and applied
# with systemd-sysusers. kanata.service runs as this user. It reads the keyboards
# through the input group, and writes the virtual keyboard through /dev/uinput,
# which udev gives to the uinput group (see udev.rules). Order matters: the
# uinput group must exist before the udev rule referencing it is reloaded.
#Type Name   ID  GECOS                    Home Shell
u      kanata -   "kanata keyboard remapper" -    -
m      kanata input
g      uinput -
m      kanata uinput
